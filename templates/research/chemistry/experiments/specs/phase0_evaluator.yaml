id: phase0_evaluator_contract
status: proposed
sample_size_per_task: [100, 500]
claims: [C-001, C-002]
checks:
  - stable reaction and source identity
  - deterministic pinned canonicalization
  - train/test reaction, product, patent-family, and mechanism-sequence disjointness
  - retro inputs contain neither atom maps nor reaction classes
  - candidate deduplication occurs before top-k
  - declared inference/model-call budget is enforced
  - predictions, failures, metrics, resources, and environment artifacts are complete
  - confidence records declare score direction, aggregation, calibration status, and correctness definition
  - all evidence is under CODEX_RESULTS_DIR and checkpoints under CODEX_CHECKPOINTS_DIR
  - sealed evidence manifest records dataset/split hashes, membership evidence, counts, model/adapter identity, and compute totals
outputs:
  results_dir_env: CODEX_RESULTS_DIR
  checkpoints_dir_env: CODEX_CHECKPOINTS_DIR
  required_results: [run-card.json, evidence-manifest.json, predictions.jsonl, metrics.json]
  completion_marker_is_sentinel_only: true
completion_marker: artifacts/phase0/COMPLETE
kill_criterion: any unresolved identity or leakage discrepancy blocks full training
